<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="vbcdr">
  <defs>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- hard offset shadow, zero blur -->
  <rect x="40" y="40" width="480" height="480" rx="108" ry="108" fill="#101010"/>

  <!-- sun ground -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="#ffd21e"/>

  <g clip-path="url(#squircle)">
    <!-- starburst rays behind the panes -->
    <g fill="#1ba0e0" opacity="0.22">
      <path d="M256 256 L512 96 L512 200 Z"/>
      <path d="M256 256 L512 264 L512 360 Z"/>
      <path d="M256 256 L400 16 L496 16 Z"/>
      <path d="M256 256 L96 16 L200 16 Z"/>
      <path d="M256 256 L16 120 L16 216 Z"/>
      <path d="M256 256 L16 296 L16 392 Z"/>
      <path d="M256 256 L120 496 L216 496 Z"/>
      <path d="M256 256 L312 496 L408 496 Z"/>
    </g>

    <!-- three terminal panes, side by side: the product in one shape -->
    <g stroke="#101010" stroke-width="22" stroke-linejoin="round">
      <rect x="74" y="150" width="104" height="212" rx="14" fill="#ffffff"/>
      <rect x="204" y="150" width="104" height="212" rx="14" fill="#ffffff"/>
      <rect x="334" y="150" width="104" height="212" rx="14" fill="#1ba0e0"/>
    </g>

    <!-- prompt carets: two idle, one live -->
    <g stroke="#101010" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M104 208 l30 26 -30 26"/>
      <path d="M234 208 l30 26 -30 26"/>
      <path d="M364 208 l30 26 -30 26"/>
    </g>

    <!-- the green lamp: the agent finished -->
    <circle cx="386" cy="318" r="26" fill="#3cb44a" stroke="#101010" stroke-width="18"/>
  </g>

  <!-- outline last, so it sits above everything -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="#101010" stroke-width="24"/>
</svg>
